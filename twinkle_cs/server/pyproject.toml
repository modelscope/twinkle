[project]
name = "twinkle-server"
version = "0.4.0.dev0"
description = "HTTP services for Twinkle training, sampling and data processing."
readme = "README.md"
authors = [{ name = "ModelScope", email = "contact@modelscope.cn" }]
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
dependencies = [
  "twinkle-kit>=0.4.0.dev0,<0.5",
  "ray[serve]>=2.55",
  "fastapi",
  "typer>=0.9.0",
  "httpx>=0.25.0",
  "pyyaml>=6",
  "modelscope-hub>=0.7.1,<1",
  "redis>=5.0",
  "psutil>=5.9.0",
  "pynvml>=11.0.0",
  "tinker==0.16.1",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp",
]

[project.scripts]
twinkle-server = "twinkle_server.cli:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["twinkle_server", "twinkle_server.*"]
