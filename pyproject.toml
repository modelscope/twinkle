[project]
name = "twinkle-kit"
version = "0.4.0.dev0"
description = "Training API for large language models with efficient data handling and advanced optimization techniques."
readme = "README.md"
authors = [{ name = "ModelScope", email = "contact@modelscope.cn" }]
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0.0,<2.3.0",
  "datasets",
  "omegaconf>=2.3.0,<3.0.0",
  "fastapi",
  "modelscope[framework]>=1.34.0",
  "safetensors",
  "peft>=0.11,<0.20",
  "transformers>=5.8,<6.0",
  "pyzmq",
  "pydantic>=2.0,<3.0",
  "typing_extensions>=4.12",
  "accelerate>=1.14.0",
  "torch>=2.6.0,<3.0.0",
]


[project.optional-dependencies]
eval = ["evalscope>=1.11,<1.12"]
megatron = ["megatron-core>=0.18,<0.21", "transformer-engine[pytorch]", "mcore_bridge>=1.5.2"]
data = ["py-data-juicer"]
oss = ["ossfs>=1.9"]
s3 = ["s3fs>=2024.10"]
rl = [
  "vllm>=0.11",
  "ray[serve]>=2.55"
]
async-rl = [
  "vllm>=0.11",
  "ray[serve]>=2.55",
  "TransferQueue>=0.1.9.dev0",
  "math-verify==0.8.0",
  "swanlab>=0.8",
]
e2b = [
  "e2b==2.31.0",
  "python-dotenv>=1.0",
]
# twinkle.metric.RougeBleu only; imported lazily so the other metrics stay dependency-free.
metric = ["jieba", "nltk", "rouge"]
test = [
  "hypothesis>=6.0",
  "jieba",
  "nltk",
  "pytest",
  "pytest-asyncio",
  "pytest-xdist",
  "rouge",
  "ruff==0.13.0",
  "grimp>=3.0"
]
docs = [
  "sphinx>=5.3.0,<6.0.0",
  "docutils>=0.16.0,<0.17.0",
  "myst_parser",
  "recommonmark",
  "sphinx-book-theme",
  "sphinx-copybutton",
  "sphinx-rtd-theme",
  "sphinx_markdown_tables",
  "sphinxcontrib-mermaid",
]

[tool.pytest.ini_options]
pythonpath = ["src", "twinkle_cs/client/src", "twinkle_cs/server/src"]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
  "accel(n): needs n accelerators (CUDA or NPU); defaults to 1",
  "slow: downloads real weights or runs a real training loop; daily CI only",
]


[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["twinkle", "twinkle.*", "twinkle_agentic", "twinkle_agentic.*"]

[tool.setuptools.package-data]
"twinkle.kernel.ops.dsv4_sas_li.aclnn" = ["*.h", "*.cpp", "**/*.cpp"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["docs/src", "*.pyi", ".git", "peft.py", "examples", "cookbook", "client_tools", "twinkle_cs/client/src/twinkle_client", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "W", "I", "UP", "T"]
ignore = ["F401", "F403", "F405", "F821", "E251"]

[tool.ruff.lint.isort]
known-first-party = ["twinkle"]
known-third-party = ["json", "yaml"]
extra-standard-library = ["setuptools"]
no-lines-before = ["standard-library", "local-folder"]
default-section = "third-party"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
quote-style = "double"
