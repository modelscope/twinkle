multitenancy_enabled: false
server:
  http_listen_port: 9009

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  bucket_store:
    sync_dir: /data/sync
  tsdb:
    dir: /data/tsdb
compactor:
  data_dir: /data/compactor
ingester:
  ring:
    replication_factor: 1
store_gateway:
  sharding_ring:
    replication_factor: 1
limits:
  compactor_blocks_retention_period: 30d
alertmanager:
  data_dir: /data/alertmanager
ruler:
  rule_path: /data/rules
