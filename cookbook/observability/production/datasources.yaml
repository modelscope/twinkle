apiVersion: 1
datasources:
  - name: Mimir
    uid: twinkle-mimir
    type: prometheus
    url: http://mimir:9009/prometheus
    access: proxy
    isDefault: true
    jsonData:
      prometheusType: Mimir
  - name: Loki
    uid: twinkle-loki
    type: loki
    url: http://loki:3100
    access: proxy
    jsonData:
      derivedFields:
        - name: Open task trace
          matcherType: label
          matcherRegex: '^twinkle_trace_id$'
          datasourceUid: twinkle-tempo
          url: '$${__value.raw}'
          urlDisplayLabel: View trace
  - name: Tempo
    uid: twinkle-tempo
    type: tempo
    url: http://tempo:3200
    access: proxy
    jsonData:
      tracesToLogsV2:
        datasourceUid: twinkle-loki
        spanStartTimeShift: '-2m'
        spanEndTimeShift: '2m'
        tags:
          - key: service.name
            value: service_name
        customQuery: true
        query: '{$${__tags}} |= "Task $${__span.tags["twinkle.request_id"]} "'
      tracesToMetrics:
        datasourceUid: twinkle-mimir
        spanStartTimeShift: '-2m'
        spanEndTimeShift: '2m'
        tags:
          - key: twinkle.node
            value: node
        queries:
          - name: Node CPU utilization
            query: 'max by (node) (twinkle_system_cpu_utilization{$${__tags}})'
          - name: Node GPU utilization
            query: 'max by (node, gpu_index, gpu_uuid) (twinkle_gpu_utilization{$${__tags}})'
          - name: Node GPU memory
            query: 'max by (node, gpu_index, gpu_uuid) (twinkle_gpu_memory_usage_bytes{$${__tags}})'
  - name: Twinkle snapshots
    uid: twinkle-redis
    type: redis-datasource
    url: $OBS_REDIS_URL
    access: proxy
    jsonData:
      client: standalone
      acl: true
      user: $OBS_REDIS_USER
      cliDisabled: true
      poolSize: 3
      timeout: 3
      pingInterval: 0
    secureJsonData:
      password: $OBS_REDIS_PASSWORD
