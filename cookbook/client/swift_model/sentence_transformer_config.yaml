# ST multi-tenant LoRA over the on-demand training pool.
# The original ST pipeline remains the base model; checkpoints contain tenant adapters.
proxy_location: EveryNode
http_options:
  host: 127.0.0.1
  port: 8000
telemetry:
  enabled: false
persistence:
  mode: memory
resources:
  startup_timeout_s: 600
  shutdown_timeout_s: 120
applications:
- name: server
  route_prefix: /api/v1
  import_path: server
  args:
    supported_models:
    - sentence-transformers/all-MiniLM-L6-v2
  deployments:
  - name: GatewayServer
    ray_actor_options:
      num_cpus: 0.1
- name: models-minilm
  route_prefix: /api/v1/model/sentence-transformers/all-MiniLM-L6-v2
  import_path: model
  args:
    backend: transformers
    model_id: hf://sentence-transformers/all-MiniLM-L6-v2
    train_mode: lora
    model_cls: swift.dev.model.multi_lora_sentence_transformer_model:MultiLoraSentenceTransformerModel
    gradient_checkpointing: false
    mixed_precision: 'no'
    min_replicas: 0
    max_replicas: 1
    idle_timeout_s: 60
    max_loras: 2
    max_r: 8
    max_length: 256
    target_modules:
    - query
    - value
    nproc_per_node: 1
    device_group:
      name: model
      ranks: 1
      device_type: cuda
    device_mesh:
      device_type: cuda
      dp_size: 1
    env_vars:
      TWINKLE_TRUST_REMOTE_CODE: '1'
    queue_config:
      execution_timeout: 300
    adapter_config:
      adapter_timeout: 300
  deployments:
  - name: ModelManagement
    ray_actor_options:
      num_cpus: 0.1
