# Twinkle Server Configuration - serving a swift model family twinkle does not
# natively support (google/gemma-4-12B-it) on the transformers backend.
#
# The `model_loader` field on the model app is the whole point of this example.
# It names a `module:callable` factory that the server imports *inside the model
# actor* at startup and calls with `model_id` to build the family loader. Here it
# points at ms-swift's `build_model_loader`, so gemma-4-12B-it is constructed by
# swift's Gemma4UnifiedLoader -- the correct model_cls, the eager-attention
# default and the vision/audio keep-alive hooks -- instead of twinkle's generic
# AutoConfig / AutoModelForCausalLM path, which cannot build this family.
#
# twinkle never hardcodes a swift symbol: it only imports whatever spec this file
# names, so the dependency stays one-directional (swift -> twinkle).
#
# Requirements:
#   - ms-swift importable in the server env (from the ms-swift root run
#     `pip install -e .`, or point PYTHONPATH at it), because the actor imports
#     `swift.dev.model.loader` at startup.
#   - transformers new enough for Gemma4UnifiedForConditionalGeneration
#     (>=5.10.1); the family declares this in its `requires`.
#   - access to the (gated) google/gemma-4-12B-it checkpoint, or a local
#     snapshot whose directory basename is `gemma-4-12B-it` so swift can infer
#     the family from the model id.

proxy_location: EveryNode

http_options:
  host: 0.0.0.0
  port: 8000

telemetry:
  enabled: false
  otlp_endpoint: http://localhost:4317

persistence:
  mode: file
  file_path: /tmp/twinkle_state.json

applications:

  # 1. Gateway / API server. The public model name clients address is
  #    google/gemma-4-12B-it (the model app's route_prefix must match it).
  - name: server
    route_prefix: /api/v1
    import_path: server
    args:
      server_config:
        per_token_model_limit: 3
      supported_models:
        - google/gemma-4-12B-it
    deployments:
      - name: TinkerCompatServer
        max_ongoing_requests: 50
        autoscaling_config:
          min_replicas: 1
          max_replicas: 1
          target_ongoing_requests: 128
        ray_actor_options:
          num_cpus: 0.1
          runtime_env:
            env_vars:
              TWINKLE_FAIL_FAST: "0"

  # 2. Training model. gemma-4-12B-it is a 12B multimodal MoE checkpoint, so
  #    shard it with FSDP across the 4 GPUs of the `model` device group. The
  #    device_mesh keys are handed to DeviceMesh.from_sizes; fsdp_size must
  #    divide the group's ranks.
  - name: models-gemma-4-12B-it
    route_prefix: /api/v1/model/google/gemma-4-12B-it
    import_path: model
    args:
      backend: transformers
      model_id: "ms://google/gemma-4-12B-it"
      # The swift family-loader factory. The server imports this at actor
      # startup and calls it with model_id; the returned loader takes over
      # config / processor / model construction. Remove this line to fall back
      # to twinkle's generic path (which cannot build gemma4).
      model_loader: swift.dev.model.loader:build_model_loader
      max_loras: 4
      max_length: 8192
      nproc_per_node: 1
      device_group:
        name: model
        ranks: 4
        device_type: cuda
      device_mesh:
        device_type: cuda
        fsdp_size: 4
      queue_config:
        rps_limit: 100
        tps_limit: 100000
      adapter_config:
        adapter_timeout: 30
    deployments:
      - name: ModelManagement
        autoscaling_config:
          min_replicas: 1
          max_replicas: 1
          target_ongoing_requests: 16
        ray_actor_options:
          num_cpus: 0.1
          runtime_env:
            env_vars:
              TWINKLE_TRUST_REMOTE_CODE: "1"
              TWINKLE_FAIL_FAST: "0"

  # 3. Processor service - tokenizes/encodes datasets on CPU workers.
  - name: processor
    route_prefix: /api/v1/processor
    import_path: processor
    args:
      ncpu_proc_per_node: 2
      device_group:
        name: model
        ranks: 2
        device_type: CPU
      device_mesh:
        device_type: CPU
        dp_size: 2
    deployments:
      - name: ProcessorManagement
        autoscaling_config:
          min_replicas: 1
          max_replicas: 1
          target_ongoing_requests: 128
        ray_actor_options:
          num_cpus: 0.1
          runtime_env:
            env_vars:
              TWINKLE_FAIL_FAST: "0"
