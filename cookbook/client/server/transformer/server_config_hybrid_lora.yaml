# Twinkle training server for Qwen/Qwen3.5-9B with Hybrid LoRA.

proxy_location: EveryNode

http_options:
  host: 0.0.0.0
  port: 8000

persistence:
  mode: memory

applications:
  - name: server
    route_prefix: /api/v1
    import_path: server
    args:
      server_config:
        per_token_model_limit: 1
      supported_models:
        - Qwen/Qwen3.5-9B
    deployments:
      - name: TinkerCompatServer
        max_ongoing_requests: 50
        autoscaling_config:
          min_replicas: 1
          max_replicas: 1
          target_ongoing_requests: 128
        ray_actor_options:
          num_cpus: 0.1
          runtime_env:
            env_vars:
              TWINKLE_FAIL_FAST: "0"

  - name: models-Qwen3.5-9B
    route_prefix: /api/v1/model/Qwen/Qwen3.5-9B
    import_path: model
    args:
      backend: transformers
      train_mode: hybrid
      model_id: "ms://Qwen/Qwen3.5-9B"
      max_length: 10240
      nproc_per_node: 4
      device_group:
        name: model
        ranks: 4
        device_type: cuda
      device_mesh:
        device_type: cuda
        fsdp_size: 4
        dp_size: 1
      max_loras: 3
      max_r: 64
      target_modules: all-linear
      hybrid:
        allocation_path: /shared/config/qwen3_5_9b_hybrid_allocation.json
        default_lr_lora: 2.5e-5
        default_lr_fft: 1.0e-6
      queue_config:
        rps_limit: 100
        tps_limit: 100000
      adapter_config:
        adapter_timeout: 1800
    deployments:
      - name: ModelManagement
        autoscaling_config:
          min_replicas: 1
          max_replicas: 1
          target_ongoing_requests: 16
        ray_actor_options:
          num_cpus: 0.1
          runtime_env:
            env_vars:
              TWINKLE_TRUST_REMOTE_CODE: "1"
              TWINKLE_FAIL_FAST: "0"

  - name: processor
    route_prefix: /api/v1/processor
    import_path: processor
    args:
      ncpu_proc_per_node: 2
      device_group:
        name: model
        ranks: 2
        device_type: CPU
      device_mesh:
        device_type: CPU
        dp_size: 2
    deployments:
      - name: ProcessorManagement
        autoscaling_config:
          min_replicas: 1
          max_replicas: 1
          target_ongoing_requests: 128
        ray_actor_options:
          num_cpus: 0.1
          runtime_env:
            env_vars:
              TWINKLE_FAIL_FAST: "0"
