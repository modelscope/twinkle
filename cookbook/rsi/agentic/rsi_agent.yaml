# ms-agent config for agentic RSI training.
#
# Read in one place only: inside the sandbox, by the `ms-agent run` the solver
# episode starts there (`--agent-config` on rsi_grpo.py names this file, and
# MsAgent passes it through as `--config`). Nothing on the training host reads it,
# so everything below describes what happens in the microVM. Editing it takes
# effect on the next episode; no image rebuild is involved.
#
# The training host contributes exactly two things, as OPENAI_BASE_URL and
# OPENAI_API_KEY: the endpoint serving the policy being trained, and the key that
# names the episode. Both are read by the `llm:` section at the bottom.

prompt:
  # Replaces ms-agent's BASE_AGENT_PROMPT (prompting/builtin.py) for the SOLVER
  # only -- the proposing episode gets prompts.py's own SYSTEM through the
  # challenger, and never reads this field. That built-in prompt is written for a
  # general assistant sitting in a user's workspace, and two of its lines work
  # against being a solver: "First decide whether the task needs tools. If you can
  # answer reliably from what you know ... just answer", and "Ask first when it
  # isn't [safe]". Here there is no one to ask (interactive: false) and answering
  # without touching the directory is always wrong.
  #
  # The paragraph about the empty directory is what 5 of armA2shellV5's 8
  # unsolved tasks needed. Their statements listed a file under "Input data:"
  # and the solver read that as "already present" -- in 5a70b77f it created the
  # file the rules told it to generate and left the two listed as input alone,
  # so it was not confused about being in an empty directory, it was following
  # the statement's own division of labour. Nothing in the statement or the
  # prompt said that division does not survive into its workspace.
  system: |
    You are a command-line agent working inside a fresh Linux container. You are
    given one task and you carry it out by running commands and writing files.
    Nobody is watching and nobody can answer a question, so never ask one and
    never stop to confirm: decide and act.

    Your working directory is /workspace and it starts COMPLETELY EMPTY. Every
    file the task mentions -- including files it describes as inputs, given data,
    existing configuration, or material you are handed -- does not exist yet. You
    have to create all of them yourself, with exactly the names and contents the
    task specifies, before anything can read them. A task that shows you the
    contents of a file is telling you what to write into it, not telling you it
    is there.

    Everything you create must live under /workspace: use a plain relative path
    (it lands in /workspace) or an absolute path that begins with /workspace/.
    write_file and any command cwd pointing anywhere else (/tmp, /app, /sandbox,
    /root, ...) is REFUSED by the tools, and only /workspace is read back when
    the task is checked -- a file written elsewhere does not count.

    How to work:
    - Start by listing the directory to see the real state. Do not assume.
    - Create every file the task names. Then do the computation it asks for and
      write the results it asks for.
    - Answering in prose without creating files is a failure, however clearly you
      can describe what the answer would be.
    - Before you finish, list the directory again and read back what you wrote.
      Check each thing the task asked for is actually there. If something is
      missing, fix it rather than reporting success.
    - Never invent a value you did not compute. If a number has to come out of
      the data, compute it from the data.

personalization:
  # Off: SOUL/AGENTS/PROFILE.md from the developer's own workspace would leak
  # machine-specific context into every training prompt.
  enabled: false

# One turn == one request to the endpoint == one sampler call. The agent decides
# when it is done, so nothing here counts turns on its behalf: the only bound on
# an episode is `--agent-timeout`, which kills the process. This value only stops
# ms-agent from imposing a lower limit of its own.
max_chat_round: 9999

# Never wait on a human: training runs unattended.
interactive: false

# How long ms-agent waits around one tool call. Written down rather than left to
# its default (tool_manager.py TOOL_CALL_TIMEOUT, 120s, overridable by the
# TOOL_CALL_TIMEOUT environment variable) so the sandbox does not inherit a
# number from whatever shell started it. It has to stay well below
# `--agent-timeout`, the only outer bound: the innermost layer should be the one
# that times out, because it is the only one that knows which call was slow. Hit
# the outer one instead and the whole episode dies with no attribution.
tool_call_timeout: 120

# Path *inside the sandbox*. One microVM per episode already isolates
# trajectories from each other, so this is a fixed path rather than a per-slot
# directory; the entry script overrides it only to match --workspace.
output_dir: /workspace

callbacks: []

tools:
  # `file_system` is declared here rather than inherited, and that is because of
  # the `llm:` section at the bottom: LLMAgent merges ms-agent's own
  # ms_agent/agent/agent.yaml under this file ONLY when this file has no `llm:`
  # key (llm_agent.py:248). With one, this file is the whole config, and an
  # omitted tool is a dropped tool rather than an inherited one.
  #
  # It is wanted on. In armA2shellV6's 128 proposing calls file_system took 63 of
  # them (43 write_file) against code_executor's 58, so removing it would remove
  # the majority of what the model reaches for. (The paragraph that used to be
  # here claimed the five were removed to stop write_file being the path of least
  # resistance -- that described a state that never existed, through every arm
  # named A2shell*, whose premise was "shell and python only".)
  file_system:
    mcp: false
    include:
      - write_file
      - read_file
      - edit_file
      - grep
      - glob
  code_executor:
    mcp: false
    # python_env means "run in this process's machine", and that machine is the
    # microVM -- the sandbox boundary is the VM itself, not this setting. Do not
    # switch to the docker implementation: it would nest a container inside the
    # VM for no extra isolation.
    implementation: python_env
    include:
      - shell_executor
      # Kept alongside the shell so that writing a file does not depend on
      # getting a heredoc right. Dropping notebook_executor because it overlaps
      # this one and adds a cell-state model nothing here needs.
      - python_executor
  todo_list:
    mcp: false
    # Kept out of the workspace root. The plan files default to
    # `<output_dir>/plan.json` and `plan.md`, and output_dir *is* the directory
    # whose end state becomes the task: 2 of ex11's 36 proposals wrote checks
    # asserting the agent's own todo bookkeeping, one of them pinning
    # `updated_at`, which no solver can reproduce. `.ms_agent/` is where
    # ms_agent/project/paths.py says framework internals belong, and the
    # workspace listing already skips it.
    plan_filename: .ms_agent/plan.json
    plan_md_filename: .ms_agent/plan.md

# The refusals ms-agent applies to a shell command, relaxed as far as a config
# can. Read by LLMAgent.prepare_runtime, which builds PermissionConfig.from_dict
# off this section.
#
# The reason is what the refusals cost here rather than what they protect: this
# runs in a microVM that is reset once per episode and holds nothing but the
# workspace, while each refusal rules out a whole family of tasks the model could
# otherwise pose. `curl`/`wget` blocked means no task can fetch a source tarball
# or a dataset.
#
# Two refusals survive this section, because SafetyConfig has no key for either
# and from_dict drops what it does not know without a word:
#
#   * is_dangerous_removal_path refuses `*`, anything ending in `/*`, `/`, a
#     direct child of `/` (which `/workspace` is), and the home directory;
#   * a glob anywhere in a write or create path is refused on its own ("Glob
#     patterns not allowed in write operations") -- not specific to rm, so
#     `cp src/* dst/` goes the same way. (`chmod +x bin/*` does not: chmod's
#     arguments are not extracted as write paths.)
#
# So `rm -rf build/*` is refused however empty the lists below are, and no task
# can start from a mess that has to be cleaned up. This used to be patched at
# runtime by an in-sandbox tool server twinkle owned; the agent now runs as
# released ms-agent, so the only honest fix is upstream, and until then the two
# keys that asked for it are gone rather than sitting here doing nothing.
permission:
  # Never wait on a human for a confirm. The nested key is the one
  # PermissionConfig.from_dict reads; a top-level `permission_mode` is not read
  # by anything.
  mode: auto
  # Drops the default blacklist wholesale: curl, wget, ssh, scp, rsync, nc,
  # netcat. (Whether the microVM actually has a route out is a separate
  # question from whether the command is allowed to run.)
  allow_network: true
  safety_rules:
    # Emptied, replacing the three baked-in patterns: `rm -rf /*`, `mkfs *`,
    # `dd if=*`. An empty list here is not the same as an absent key -- absent
    # means "use the defaults".
    patterns: []
    # Same, for the configurable half of the rm/rmdir path check: `*`, `/*`,
    # `/`, `~`. Emptied rather than removed to say the intent out loud, and it
    # is only the configurable half -- see the paragraph above for the rest.
    dangerous_removal_paths: []

# Web search is deliberately absent. ms-agent's `web_search` key only provides
# fetch_page (retrieve a known URL); a real query-a-search-engine tool needs
# EXA_API_KEY / SERPAPI_API_KEY and is wired separately from the plain tool
# list. Add it here once that is decided; until then no task should need it.

# The policy being trained, reached over HTTP. `service: openai` is what makes
# ms-agent read OPENAI_BASE_URL / OPENAI_API_KEY from the environment, which is
# how the two values the trainer sets arrive: the endpoint in front of the live
# sampler, and the key that identifies this episode's account. Neither is written
# here -- an endpoint is bound per run and a key is minted per episode -- and
# leaving them blank is what lets the environment supply them.
#
# The model name is not a choice: the endpoint serves whatever the trainer is
# updating and ignores this field, so it exists only because ms-agent requires
# one. Do not point it at a real provider's model as a fallback; a config that
# quietly answers from another model trains the policy on tokens it never wrote.
#
# No `generation_config` on purpose. ms-agent's own default asks for
# temperature 0.3, and this file no longer inherits it (see `tools:` above): a
# request that names no temperature gets the trainer's own sampling parameters,
# which is what a rollout has to be sampled at.
llm:
  service: openai
  model: twinkle-policy
  openai_api_key:
  openai_base_url:
  # Raised from ms-agent's 300s read timeout, which is sized for a hosted
  # provider. This endpoint is one sampler answering every concurrent episode as
  # the requests arrive, so a queued generation waits behind the others; a client
  # that gives up at 300s abandons a turn the sampler is still producing, and the
  # episode reads as a dead endpoint.
  timeout: 1200
