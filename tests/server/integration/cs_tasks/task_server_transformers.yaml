# Prepare the persisted bases with task_models.py before starting this server from the repository root.
# Each public alias has one frozen base and two independent LoRA tenant slots.
http_options:
  host: 127.0.0.1
  port: 8000
telemetry:
  enabled: false
persistence:
  mode: memory
resources:
  startup_timeout_s: 600
  shutdown_timeout_s: 120
applications:
- name: server
  import_path: server
  route_prefix: /api/v1
  args:
    supported_models: [cs-embedding, cs-reranker, cs-seq_cls]
  deployments:
  - name: GatewayServer
    ray_actor_options: {num_cpus: 0.1}
- name: embedding
  import_path: model
  route_prefix: /api/v1/model/cs-embedding
  args: &model_args
    backend: transformers
    model_id: output/cs-models/embedding
    train_mode: lora
    task_type: causal_lm
    gradient_checkpointing: false
    mixed_precision: 'no'
    max_loras: 2
    max_r: 8
    max_length: 256
    min_replicas: 0
    max_replicas: 1
    idle_timeout_s: 60
    nproc_per_node: 1
    device_group: {name: model, ranks: 1, device_type: cuda}
    device_mesh: {device_type: cuda, dp_size: 1}
    target_modules: [q_proj, v_proj]
    queue_config: {execution_timeout: 600}
  deployments: &deployments
  - name: ModelManagement
    ray_actor_options: {num_cpus: 0.1}
- name: reranker
  import_path: model
  route_prefix: /api/v1/model/cs-reranker
  args:
    <<: *model_args
    model_id: output/cs-models/reranker
    task_type: seq_cls
    num_labels: 1
    target_modules: [q_proj, v_proj, score]
  deployments: *deployments
- name: seq-cls
  import_path: model
  route_prefix: /api/v1/model/cs-seq_cls
  args:
    <<: *model_args
    model_id: output/cs-models/seq_cls
    task_type: seq_cls
    num_labels: 3
    target_modules: [q_proj, v_proj, score]
  deployments: *deployments
