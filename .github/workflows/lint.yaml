name: Lint test

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Keep in sync with the ruff rev in .pre-commit-config.yaml and the test extra in pyproject.toml.
      - name: Install ruff
        run: pip install ruff==0.13.0
      - name: Linting
        run: |
          ruff check .
          ruff format --check .

  # The GPU CI installs with --no-deps (the image owns the stack), so the pyproject ranges
  # would otherwise never be exercised. Resolve them here -- metadata only, nothing installed --
  # so an unsatisfiable or contradictory declaration fails loudly on every push.
  dependency-resolution:
    name: Dependency resolution (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: twinkle-kit
            requirements: .
          - package: twinkle-client
            requirements: . ./twinkle_cs/client
          - package: twinkle-server
            requirements: . ./twinkle_cs/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve declared dependency ranges
        run: python -m pip install --dry-run --ignore-installed ${{ matrix.requirements }}
