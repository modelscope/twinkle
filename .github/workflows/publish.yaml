name: release

on:
  push:
    tags:
      - 'v**'
      - 'twinkle-client-v**'
      - 'twinkle-server-v**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-publish
  cancel-in-progress: true

jobs:
  build-n-publish:
    runs-on: ubuntu-22.04
    #if: startsWith(github.event.ref, 'refs/tags')
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python 3.11
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'
      - name: Install build
        run: pip install build
      - name: Build twinkle-kit
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -m build --outdir dist
      - name: Build twinkle-client
        if: startsWith(github.ref, 'refs/tags/twinkle-client-v')
        run: python -m build twinkle_cs/client --outdir dist
      - name: Build twinkle-server
        if: startsWith(github.ref, 'refs/tags/twinkle-server-v')
        run: python -m build twinkle_cs/server --outdir dist
      - name: Publish package to PyPI
        run: |
          pip install twine
          twine upload dist/* --skip-existing -u __token__ -p ${{ secrets.PYPI_API_TOKEN }}
