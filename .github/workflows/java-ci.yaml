name: Java Client CI

on:
  push:
    paths:
      - "javaclient/**"
      - ".github/workflows/java-ci.yaml"
  pull_request:
    paths:
      - "javaclient/**"
      - ".github/workflows/java-ci.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven Build
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: javaclients/pom.xml

      - name: Run Formatting and Build Verification
        run: mvn -B -f javaclients/pom.xml verify
